<!doctype html>
<!-- Made with TilTale version __VERSION__ -->
<html lang="__LANGUAGE__">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="only light">
  <title>__TITLE__</title>
  <link rel="icon" href="__ROOT__favicon.ico">
  <link rel="stylesheet" href="__ROOT__style.css">
</head>
<body>
  <main id="viewport">
    <div id="loading">
      <img src="__ROOT__logo-tiltale.png" alt="">
      <div id="progress"><i></i></div>
      <p id="progress-text">Loading story… 0%</p>
    </div>
    <div id="story" hidden></div>
    <div id="viewer" hidden>
      <button type="button" data-zoom="1.25" aria-label="Zoom in">+</button>
      <button type="button" data-zoom="0.8" aria-label="Zoom out">−</button>
      <button type="button" data-close></button>
    </div>
    <button type="button" id="fullscreen" aria-label="Full screen" hidden>
      <!-- Four corner brackets, drawn here: the ⛶ character is missing from many phone fonts. -->
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div id="notice" role="status" hidden></div>
  </main>
  <noscript>This interactive story requires JavaScript.</noscript>
  <script src="story.js"></script>
  <script src="__ROOT__bubbles.js"></script>
  <script src="__ROOT__tiltale.js"></script>
</body>
