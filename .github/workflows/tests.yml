name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the version check compares with the base branch

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Django configuration
        run: python manage.py check

      - name: Check migrations are committed
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test

      - name: Check runtime syntax
        run: |
          node --check runtime/tiltale.js
          node --check studio/static/studio/app.js
          php -l runtime/log.php

      - name: Check the version was bumped
        if: github.event_name == 'pull_request'
        run: |
          git diff "origin/$GITHUB_BASE_REF" -- config/settings.py | grep -q '^+TILTALE_VERSION' \
            || { echo "::error file=config/settings.py::Bump TILTALE_VERSION (currently $(grep -o '"[0-9.]*"' config/settings.py | head -1))."; exit 1; }
